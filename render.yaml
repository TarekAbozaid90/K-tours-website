services:
  - type: web
    name: k-tours-fullstack
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: k-tours-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: k-tours-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        value: "201009494068"

databases:
  - name: k-tours-db
    databaseName: ktours
    user: ktours_user
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []
